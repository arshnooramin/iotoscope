<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="color-scheme" content="light dark">
		<title>ioto · IoT Oscilloscope</title>
		<link rel="icon" href="favicon.ico">
		<link rel="stylesheet" href="main.css">
	</head>
	<body>
		<header class="topbar">
			<a class="brand" href="/">
				<svg width="22" height="28" viewBox="0 0 68 88" aria-hidden="true">
					<path fill="#00d1b2" d="M27 1C47-2 64 13 67 37c3 25-9 49-30 51C16 90 2 75 1 52-1 28 8 4 27 1Z"/>
				</svg>
				<span class="brand-name">ioto</span>
				<span class="brand-tag">IoT Oscilloscope</span>
			</a>
			<span id="status" class="status" data-state="connecting" role="status">Connecting…</span>
		</header>

		<main>
			<section class="card" aria-labelledby="analog-title">
				<div class="card-head">
					<div>
						<h2 id="analog-title">Analog</h2>
						<p class="sub">Channel 1 · GPIO7 · last 10 s</p>
					</div>
					<div class="actions">
						<select id="rate" class="btn" aria-label="Sample rate">
							<option value="2">2 Hz</option>
							<option value="5">5 Hz</option>
							<option value="10" selected>10 Hz</option>
							<option value="20">20 Hz</option>
						</select>
						<button id="pause" class="btn" type="button" aria-pressed="false">
							<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path id="pause-icon" d="M4 3h3v10H4zM9 3h3v10H9z"/></svg>
							<span id="pause-label">Pause</span>
						</button>
						<button id="save" class="btn" type="button" title="Save chart as PNG">
							<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M3 13h10"/></svg>
							Save
						</button>
					</div>
				</div>
				<div class="readout">
					<div class="reading"><span id="reading">–.–––</span><small>V</small></div>
					<div class="stats">
						<span>min <b id="min">–</b></span>
						<span>max <b id="max">–</b></span>
					</div>
				</div>
				<canvas id="scope" class="scope" role="img" aria-label="Channel 1 voltage over the last 10 seconds"></canvas>
			</section>

			<section class="card" aria-labelledby="digital-title">
				<div class="card-head">
					<div>
						<h2 id="digital-title">Digital</h2>
						<p class="sub">Set each pin to off, input, or output</p>
					</div>
				</div>
				<div id="pins" class="pins"></div>
			</section>
		</main>

		<template id="pin-template">
			<div class="pin">
				<div class="pin-head">
					<span class="pin-name"></span>
					<span class="pin-gpio"></span>
				</div>
				<div class="segmented" role="radiogroup">
					<label><input type="radio" value="off"><span>Off</span></label>
					<label><input type="radio" value="input"><span>In</span></label>
					<label><input type="radio" value="output"><span>Out</span></label>
				</div>
				<button class="level" type="button"></button>
			</div>
		</template>

		<script src="main.js"></script>
	</body>
</html>
